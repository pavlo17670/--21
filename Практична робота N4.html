<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Курс HTML для початківців</title>
</head>
<body>
    <header>
        <h1>Курс HTML для початківців</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="lessons.html">Програма уроків</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Про курс</h2>
            <img src="students.jpg" alt="Студенти навчаються за комп'ютерами">
            <p>
                На курсі ви навчитеся створювати вебсторінки.
            </p>
        </section>

        <section>
            <h2>Реєстрація</h2>
            <form>
                <div>
                    <label for="name">Ім'я:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <br>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <br>
                <button type="submit">Зареєструватися</button>
            </form>
        </section>
    </main>

<!--
Виправлені проблеми доступності (Accessibility):
1. Додано атрибут lang="uk" у тег <html> для правильного визначення мови документа екранними зчитувачами (screen readers).
2. Виправлено структуру заголовків: головний заголовок сторінки змінено з <h2> на <h1>, а підзаголовки блоків змінено з <h4> на <h2> для дотримання ієрархії.
3. Додано семантичні теги <header>, <main>, <nav> та <section> для логічної структуризації вмісту сторінки.
4. Оновлено текст посилань: замість неінформативних "Тут" та "Натиснути тут" вказано зрозумілі описові назви ("Програма уроків", "Контакти").
5. Додано атрибут alt="Студенти навчаються за комп'ютерами" до зображення <img> для надання альтернативного тексту людям із порушеннями зору.
6. Підписи полів форми огорнуто в теги <label> та пов'язано з відповідними елементами <input> за допомогою атрибута for та id.
7. Змінено тип поля для введення електронної пошти з type="text" на type="email" для кращої валідації та зручності введення на мобільних пристроях.
-->
</body>
</html>
